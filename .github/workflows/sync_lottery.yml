name: Sync Lottery Draw Data (TC & FC)

on:
  schedule:
    # 每天北京时间 21:40 (UTC 13:40) 和 22:15 (UTC 14:15) 自动抓取最新开奖结果
    - cron: '40 13 * * *'
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest lottery draws
        run: python3 scripts/sync_lottery_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lottery_data.json
          git diff --cached --quiet || git commit -m "chore: sync latest TC/FC lottery draw results"
          git push
